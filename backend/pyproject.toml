# Group Planning Assistant — backend project definition.
#
# This file is the single source of truth for the Python package: what
# the code is called, what other packages it needs (as *installed*
# dependencies only — roadmap D-46), and how the tools are configured.
# The project's licence is GPLv2 — GNU General Public License
# version 2 — decided by Volmarr on 2026-10-24 ("GPLv2 is the
# project liscense"), superseding the earlier undecided posture
# (roadmap D-25). The licence field below states it in SPDX form.

[project]
name = "group-planning-assistant-backend"
version = "0.1.0"
description = "Group Planning Assistant — Python backend (planning from conversation, flyers, and newsletters, always with a human review queue)."
readme = "README.md"
license = {text = "GPL-2.0-only"}
requires-python = ">=3.12"
dependencies = [
    # Web framework + server (roadmap D-02/D-03).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Validation + settings (D-04); one schema layer validates API
    # input, AI output, and test fixtures alike.
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Database: SQLAlchemy 2.0 models + Alembic migrations (D-07).
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # HTTP client — used by tests and by outbound integrations.
    "httpx>=0.27",
    # Image handling for flyer/board uploads (later phases).
    "pillow>=10.3",
    # RFC 5545 calendar output (D-20).
    "icalendar>=5.0",
    # Password hashing: Argon2id (B-011; choice recorded in
    # PROJECT_MEMORY_MAP.md — argon2-cffi over pwdlib for its direct,
    # dependency-light binding to the reference Argon2 library).
    "argon2-cffi>=23.1",
    "jinja2>=3.1.6",
    # PostgreSQL driver (B-152, decision D-06): a deployment
    # that promotes to Postgres runs THIS process against it —
    # server, worker, migrations, and the data mover alike —
    # so the driver is a runtime dependency, not a dev extra.
    # SQLite stays the default; the URL is the only switch.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]
queue = [
    "arq>=0.28.0",
]

[project.scripts]
# One command to run the background worker on its own, for operators
# who run the service split across processes (roadmap Phase 20/26:
# the service must be happy living in the background).
gpa-worker = "gpa.worker:main"
# The external-queue twin (B-157): same handlers, arq/Redis
# transport, for deployments that selected GPA_JOB_QUEUE=arq.
gpa-arq-worker = "gpa.arq_worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpa"]

[tool.pytest.ini_options]
# Tests live in tests/ and import the package from src/ (uv sync
# installs it editable, so no path tricks are needed here).
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
