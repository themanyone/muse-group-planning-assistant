# Alembic configuration for the Group Planning Assistant backend.
# The database URL is NOT set here on purpose: migrations/env.py
# reads it from the app's own settings (GPA_DATABASE_URL), so the
# migration path and the running app can never disagree.
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
